name: Build Paperclip PR image

# Builds an upstream paperclipai/paperclip pull request into
# ghcr.io/<you>/paperclip:pr-<number>-<sha> and (optionally) pins Paperclip Edge to it.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "paperclipai/paperclip PR number"
        required: true
        type: string
      pin:
        description: "Pin homelab-paperclip to the new image and commit"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: paperclip-pr-${{ inputs.pr }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          repository: paperclipai/paperclip
          ref: refs/pull/${{ inputs.pr }}/head
          path: paperclip
          fetch-depth: 0

      - name: Resolve tags
        id: meta
        run: |
          cd paperclip
          sha=$(git rev-parse --short=7 HEAD)
          base=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/paperclip:pr-${{ inputs.pr }}-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${base:-0.0.0}-pr${{ inputs.pr }}.${sha}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, production target)
        uses: docker/build-push-action@v6
        with:
          context: paperclip
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.meta.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out app store
        if: inputs.pin
        uses: actions/checkout@v4
        with:
          path: store

      - name: Pin Paperclip Edge to this build
        if: inputs.pin
        run: |
          cd store/homelab-paperclip
          sed -i -E "s#^(    image: ).*#\1${{ steps.meta.outputs.image }}#" docker-compose.yml
          sed -i -E "s#^(    \# Current pin = ).*#\1PR ${{ inputs.pr }} (commit ${{ steps.meta.outputs.commit }}).#" docker-compose.yml
          sed -i -E "s#^version: .*#version: \"${{ steps.meta.outputs.version }}\"#" umbrel-app.yml
          sed -i -E "s#^releaseNotes: .*#releaseNotes: \"Pinned to paperclipai/paperclip PR \#${{ inputs.pr }} (commit ${{ steps.meta.outputs.commit }}).\"#" umbrel-app.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Pin Paperclip Edge to PR #${{ inputs.pr }} (${{ steps.meta.outputs.image }})"
          git push
